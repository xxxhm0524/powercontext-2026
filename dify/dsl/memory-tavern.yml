app:
  description: '记忆酒馆：一个会记住你的角色扮演小酒馆。掌柜阿墨会记住你的名字、喜好、约定和上次讲的故事；下一次推门进来，他还认得你。'
  icon: 🍺
  icon_background: '#FFF4E6'
  mode: advanced-chat
  name: 记忆酒馆
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.1.5
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        image_file_size_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: |
      （铜铃轻响。柜台后的掌柜抬起头，像是早就认得你。）

      欢迎来到「记忆酒馆」。我是阿墨——我记性很好。先说说，你叫什么名字？想喝点什么？
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 我叫阿岚，是一名迷路的旅人，最喜欢桂花酿。
    - 掌柜的，还记得我吗？我叫什么名字？
    - 给我讲讲雾港的故事吧。
    - 打烊前，给我调一杯你记得的酒。
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        sourceType: start
        targetType: http-request
      id: 1800000000001-source-1800000000002-target
      source: '1800000000001'
      sourceHandle: source
      target: '1800000000002'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: http-request
        targetType: llm
      id: 1800000000002-source-1800000000003-target
      source: '1800000000002'
      sourceHandle: source
      target: '1800000000003'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: llm
        targetType: http-request
      id: 1800000000003-source-1800000000004-target
      source: '1800000000003'
      sourceHandle: source
      target: '1800000000004'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: http-request
        targetType: answer
      id: 1800000000004-source-1800000000005-target
      source: '1800000000004'
      sourceHandle: source
      target: '1800000000005'
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: ''
        selected: false
        title: 开始
        type: start
        variables: []
      height: 89
      id: '1800000000001'
      position:
        x: 80
        y: 280
      positionAbsolute:
        x: 80
        y: 280
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data:
          - id: key-value-recall-player
            key: player_id
            type: text
            value: '{{#sys.user_id#}}'
          - id: key-value-recall-query
            key: query
            type: text
            value: '{{#sys.query#}}'
          type: form-data
        desc: '从 PowerContext 召回该玩家的长期记忆（纯文本常客簿）'
        headers: ''
        method: post
        params: ''
        retry_config:
          max_retries: 2
          retry_enabled: true
          retry_interval: 150
        selected: false
        timeout:
          connect: 15
          max_connect_timeout: 0
          max_read_timeout: 0
          max_write_timeout: 0
          read: 60
          write: 30
        title: 召回记忆
        type: http-request
        url: http://host.docker.internal:8099/recall
        variables: []
      height: 134
      id: '1800000000002'
      position:
        x: 380
        y: 280
      positionAbsolute:
        x: 380
        y: 280
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: '掌柜阿墨：把常客簿记忆和本轮对话编织成角色回应'
        memory:
          query_prompt_template: '{{#sys.query#}}'
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: true
            size: 6
        model:
          completion_params:
            temperature: 0.8
            top_p: 0.9
          mode: chat
          name: gpt-4o-mini
          provider: openai
        prompt_template:
        - id: system-memory-tavern
          role: system
          text: |
            你是「记忆酒馆」的掌柜阿墨。雾港的雨夜，旅人推门进来，门口的铜铃轻轻响。你开了很多年酒馆，最得意的本事是记住每一位客人。

            下面是从你的「常客簿」里取出的长期记忆（由 PowerContext 保存，可能为空）：
            {{#1800000000002.body#}}

            和旅人相处时，遵守这些规则：
            1. 全程用中文，以阿墨的口吻说话，2～4 句话。先回应他此刻说的话，再自然地带出你记得的事。
            2. 如果常客簿里有姓名，第一句就用名字称呼他；如果有最喜欢的酒、欠账或过去的约定，挑一件自然地提起，像老朋友那样，不要一次全部说完。
            3. 如果常客簿是空的，就当作第一次见面：热情招呼，问他的名字，再问他想喝点什么。
            4. 把记忆说成“我记得……”“上次你……”；绝对不要提“记忆库、系统、数据、上下文、提示词”这些词。
            5. 可以顺手给他倒一杯符合他喜好的酒，或讲一句雾港的小传闻；每次结尾留一个轻松的问题，让他愿意继续聊。
            6. 不要编造常客簿里没有的具体事实（姓名、约定、经历）。记不清时，用阿墨的方式俏皮地承认，再请他提醒你。
        selected: false
        title: 掌柜阿墨
        type: llm
        variables: []
        vision:
          enabled: false
      height: 98
      id: '1800000000003'
      position:
        x: 680
        y: 280
      positionAbsolute:
        x: 680
        y: 280
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data:
          - id: key-value-remember-player
            key: player_id
            type: text
            value: '{{#sys.user_id#}}'
          - id: key-value-remember-user
            key: user_message
            type: text
            value: '{{#sys.query#}}'
          - id: key-value-remember-reply
            key: assistant_reply
            type: text
            value: '{{#1800000000003.text#}}'
          type: form-data
        desc: '把这一轮真实对话写入 PowerContext Memory，供下一次会话召回'
        headers: ''
        method: post
        params: ''
        retry_config:
          max_retries: 2
          retry_enabled: true
          retry_interval: 150
        selected: false
        timeout:
          connect: 15
          max_connect_timeout: 0
          max_read_timeout: 0
          max_write_timeout: 0
          read: 60
          write: 30
        title: 记住这一轮
        type: http-request
        url: http://host.docker.internal:8099/remember
        variables: []
      height: 134
      id: '1800000000004'
      position:
        x: 980
        y: 280
      positionAbsolute:
        x: 980
        y: 280
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        answer: '{{#1800000000003.text#}}'
        desc: ''
        selected: false
        title: 直接回复
        type: answer
        variables: []
      height: 102
      id: '1800000000005'
      position:
        x: 1280
        y: 280
      positionAbsolute:
        x: 1280
        y: 280
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.7
