[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdd-context"
version = "1.0.0"
description = "Spec-driven development context module for the MiniMax competition task"
requires-python = ">=3.11"
dependencies = [
    "pymysql>=1.1.1",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["sdd_context*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
