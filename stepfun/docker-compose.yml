services:
  seekdb:
    image: oceanbase/seekdb:latest
    container_name: stepfun-seekdb
    ports:
      - "2881:2881"
      - "2886:2886"
    environment:
      ROOT_PASSWORD: ""
      CPU_COUNT: "2"
      MEMORY_LIMIT: "2G"
      LOG_DISK_SIZE: "2G"
      DATAFILE_SIZE: "2G"
      SEEKDB_DATABASE: "test"
    volumes:
      - seekdb-data:/var/lib/oceanbase
    restart: unless-stopped

volumes:
  seekdb-data:
